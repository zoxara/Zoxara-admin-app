name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto Unzip or Detect Files
        run: |
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Zip file එකක් හමු විය: $ZIP_FILE. Extract කරමින් පවතී..."
            unzip -o "$ZIP_FILE"
            FOLDER_NAME=$(basename "$ZIP_FILE" .zip)
            if [ -d "$FOLDER_NAME" ]; then
              cp -r "$FOLDER_NAME"/* .
            fi
          else
            echo "Zip file එකක් නැත. Root එකේ ඇති files සෘජුවම භාවිත කරයි."
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Compatible Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew

      - name: Auto Create Matched google-services.json
        run: |
          mkdir -p app
          echo '{"project_info":{"project_number":"123456789012","project_id":"zoxara-app","storage_bucket":"zoxara-app.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:1234567890123456","android_client_info":{"package_name":"com.aistudio.zoxaraadmin.portal"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForBuildOnly"}]}]}' > app/google-services.json

      - name: Auto Generate Debug Keystore
        run: |
          mkdir -p app
          keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp app/debug.keystore ./debug.keystore || true

      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true -Xmx4096m"
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
