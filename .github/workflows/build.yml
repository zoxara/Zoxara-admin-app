name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project files & Fix directory
        run: |
          unzip -o zoxara-elite-admin.zip
          if [ -d "zoxara-elite-admin" ]; then
            cp -r zoxara-elite-admin/* .
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Auto Fix & Build APK
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew file එක නොමැති බැවින් නව wrapper එකක් සාදයි..."
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
          
