name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project files & Fix directory
        run: |
          unzip -o zoxara-elite-admin.zip
          if [ -d "zoxara-elite-admin" ]; then
            cp -r zoxara-elite-admin/* .
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Compatible Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew

      - name: Auto Create Dummy google-services.json
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo "Missing google-services.json සඳහා dummy file එකක් සාදයි..."
            mkdir -p app
            echo '{"project_info":{"project_number":"123456789012","project_id":"zoxara-app","storage_bucket":"zoxara-app.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:1234567890123456","android_client_info":{"package_name":"com.zoxara.app"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForBuildOnly"}]}]}' > app/google-services.json
          fi

      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true -Xmx4096m"
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
